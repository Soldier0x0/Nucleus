<!doctype html>
<!-- Nucleus-native rebuild of the Forever Components "Empty State" technique.
     Upstream reference: plan/design/forever/empty-state.html (untracked, licence-unstated — study only).
     Extraction notes: plan/design-sources.md → "Pattern rebuilds" → "Empty State".
     Kept (ported warm): the open-vessel illustration, reduced to one inline SVG on paper,
     and the settle-keyed rim brightness idea — the rim reads --accent at full strength only
     once settled. One settle animation on first paint, then the page is still: no ambient
     drift exists. Not ported, honoring their own avoidWhen ("motion competes with a
     call-to-action"): the 26-mote canvas cloud, scatter physics and idle drift.
     Context: the Money ledger before the first expense. Nucleus tokens + v0.17 motion tier. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Nucleus-native empty state: an inline SVG vessel settles once on paper — rim brightens to accent — with a real headline, sentence and primary action. Then everything is still.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nucleus — Empty State (rebuilt)</title>
<style>
  /* Tokens carried verbatim from desktop/src/styles.css (v0.16.1 stage). */
  :root, :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f1ea; --panel: #ffffff; --panel-2: #ede7dc;
    --ink: #221c15; --muted: #6e6455; --faint: #9c9181;
    --line: rgba(32, 26, 19, 0.085);
    --accent: #be7a2e; --accent-strong: #a9661f; --accent-ink: #fff8ec;
    --accent-soft: rgba(190, 122, 46, 0.13);
    --ok: #4c8a57; --ok-soft: rgba(76, 138, 87, 0.14);
    --warn: #bc8524; --warn-soft: rgba(188, 133, 36, 0.16);
    --error: #b4534b; --error-soft: rgba(180, 83, 75, 0.14);
    --shadow: 0 1px 2px rgba(30, 24, 17, 0.05), 0 10px 26px -20px rgba(30, 24, 17, 0.28);
    /* v0.17 motion tokens (plan/desktop-uix-v017.md §5) */
    --fast: 120ms; --base: 200ms; --spring: 320ms cubic-bezier(.32,.72,0,1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161310; --panel: #211d18; --panel-2: #1b1713;
    --ink: #f1ebe0; --muted: #a79b8a; --faint: #786e60;
    --line: rgba(255, 255, 255, 0.075);
    --accent: #d8934c; --accent-strong: #e8a45c; --accent-ink: #241708;
    --accent-soft: rgba(216, 147, 76, 0.16);
    --ok: #7fb98a; --ok-soft: rgba(127, 185, 138, 0.16);
    --warn: #d9a94c; --warn-soft: rgba(217, 169, 76, 0.18);
    --error: #d9837a; --error-soft: rgba(217, 131, 122, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -22px rgba(0, 0, 0, 0.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    display: grid; place-items: center;
    font: 14px/1.5 "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(100%, 396px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 18px 20px 26px;
  }
  .hd h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .hd p  { font-size: 12px; color: var(--muted); margin: 3px 0 6px; }

  /* The vessel — one inline SVG, no canvas. Rim brightness is settle-keyed:
     it starts at 25% (--accent-soft feel) and settles to full --accent once. */
  .fig { margin: 14px 0 2px; }
  .fig svg { display: block; width: 164px; margin: 0 auto; }
  .fig svg, .v-rim { will-change: transform, opacity; }
  .fig svg {
    animation: settle 460ms cubic-bezier(.32,.72,0,1) both;
  }
  @keyframes settle { from { transform: translateY(-5px); } to { transform: translateY(0); } }
  .v-void  { fill: var(--panel-2); }
  .v-back  { fill: none; stroke: color-mix(in srgb, var(--muted) 45%, transparent); stroke-width: 2; }
  .v-walls { fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; }
  .v-rim {
    fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round;
    stroke-dasharray: 76 24;    /* front arc only (pathLength=100), from 3 o'clock clockwise */
    opacity: .25;
    animation: rimsettle 520ms var(--spring) 160ms both;
  }
  @keyframes rimsettle { from { opacity: .25; } to { opacity: 1; } }
  .v-ground {
    fill: none; stroke: color-mix(in srgb, var(--faint) 55%, transparent);
    stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 4 7;
  }

  .copy { text-align: center; }
  .copy h3 { font-size: 14px; font-weight: 600; letter-spacing: -.005em; margin: 12px 0 0; }
  .copy p  { font-size: 12px; color: var(--muted); margin: 5px auto 0; max-width: 30ch; }
  .cta {
    appearance: none; cursor: pointer; margin-top: 16px;
    border: 1px solid color-mix(in srgb, var(--accent-strong) 55%, transparent);
    background: var(--accent); color: var(--accent-ink);
    font: 600 13px/1 "Inter", sans-serif; padding: 10px 18px; border-radius: 8px;
    transition: background var(--fast) ease, transform var(--fast) ease;
  }
  .cta:hover { background: var(--accent-strong); }
  .cta:active { transform: scale(.985); }
  .cta:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  .cap { position: fixed; left: 12px; bottom: 12px;
         font: 600 10px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
         color: var(--faint); letter-spacing: .08em; text-transform: uppercase; user-select: none; }
  .chip { position: fixed; right: 14px; bottom: 12px; appearance: none; cursor: pointer;
          border: 1px solid var(--line); background: var(--panel); color: var(--muted);
          border-radius: 999px; padding: 8px 14px;
          font: 600 11px/1 "Inter", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .chip:hover { color: var(--ink); }
  .chip:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    .fig svg, .v-rim { animation: none; }
    .v-rim { opacity: 1; }
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <main class="card" aria-label="Money empty state preview">
    <div class="hd">
      <h2>Money</h2>
      <p>Ledger · October</p>
    </div>
    <div class="fig">
      <svg viewBox="0 0 168 112" role="img" aria-label="An empty ledger vessel">
        <line class="v-ground" x1="24" y1="88" x2="144" y2="88"/>
        <ellipse class="v-void" cx="84" cy="40" rx="47" ry="12.5"/>
        <path class="v-walls" d="M37 40 C37 62, 55 70, 84 70 C113 70, 131 62, 131 40"/>
        <ellipse class="v-back" cx="84" cy="40" rx="47" ry="12.5"/>
        <ellipse class="v-rim" cx="84" cy="40" rx="47" ry="12.5" pathLength="100"/>
      </svg>
    </div>
    <div class="copy">
      <h3 id="cta-l">No transactions yet</h3>
      <p>Add your first expense to start the ledger — transfers stay excluded.</p>
      <button class="cta" type="button" aria-labelledby="cta-l">Add expense</button>
    </div>
  </main>
  <div class="cap">Nucleus · Empty state (rebuilt)</div>
  <button class="chip" type="button" id="themeBtn">Light / Dark</button>
<script>
(function () {
  "use strict";
  // Event-driven: the CTA has a real press state, everything else settles once and stops.
  // (The illustration animates exactly once on paint; nothing loops, nothing drifts.)
  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var el = document.documentElement;
    var dark = el.getAttribute("data-theme") === "dark";
    el.setAttribute("data-theme", dark ? "light" : "dark");
    themeBtn.textContent = dark ? "Light / Dark" : "Dark / Light";
  });
})();
</script>
</body>
</html>
