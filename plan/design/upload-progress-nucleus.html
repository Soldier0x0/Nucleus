<!doctype html>
<!-- Nucleus-native rebuild of the Forever Components "Upload Progress" technique.
     Upstream reference: plan/design/forever/upload-progress.html
     (RAW PENDING RE-ARCHIVE — paste lost in context compaction; licence-unstated, study
     only. Technique values below come from the documented extraction pass in the digest).
     Extraction notes: plan/design-sources.md → "Pattern rebuilds" → "Upload Progress".
     Kept: the two-half-circle compositor pie (the left/right half-arc rL/rR pair — rL
     covers 0–180°, rR un-hides past 50%) and the exact easeInOutCubic 2800ms fill.
     Stripped: the auto-restarting demo loop and the glow stack. Retargeted: a real
     trigger (Health data export) — the only latency is the simulated export itself.
     Completion semantics: --accent → --ok stroke swap + tick draw-in (260ms, 70ms delay),
     role="status" announces. One rAF drives both dashoffsets; settle-and-stop. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Nucleus-native upload progress: a two-half compositor ring fills on an easeInOutCubic 2800ms run triggered by a real export action, swaps to --ok with a tick draw at 100%.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nucleus — Upload Progress (rebuilt)</title>
<style>
  /* Tokens carried verbatim from desktop/src/styles.css (v0.16.1 stage). */
  :root, :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f1ea; --panel: #ffffff; --panel-2: #ede7dc;
    --ink: #221c15; --muted: #6e6455; --faint: #9c9181;
    --line: rgba(32, 26, 19, 0.085);
    --accent: #be7a2e; --accent-strong: #a9661f; --accent-ink: #fff8ec;
    --accent-soft: rgba(190, 122, 46, 0.13);
    --ok: #4c8a57; --ok-soft: rgba(76, 138, 87, 0.14);
    --warn: #bc8524; --warn-soft: rgba(188, 133, 36, 0.16);
    --error: #b4534b; --error-soft: rgba(180, 83, 75, 0.14);
    --shadow: 0 1px 2px rgba(30, 24, 17, 0.05), 0 10px 26px -20px rgba(30, 24, 17, 0.28);
    /* v0.17 motion tokens (plan/desktop-uix-v017.md §5) */
    --fast: 120ms; --base: 200ms; --spring: 320ms cubic-bezier(.32,.72,0,1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161310; --panel: #211d18; --panel-2: #1b1713;
    --ink: #f1ebe0; --muted: #a79b8a; --faint: #786e60;
    --line: rgba(255, 255, 255, 0.075);
    --accent: #d8934c; --accent-strong: #e8a45c; --accent-ink: #241708;
    --accent-soft: rgba(216, 147, 76, 0.16);
    --ok: #7fb98a; --ok-soft: rgba(127, 185, 138, 0.16);
    --warn: #d9a94c; --warn-soft: rgba(217, 169, 76, 0.18);
    --error: #d9837a; --error-soft: rgba(217, 131, 122, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -22px rgba(0, 0, 0, 0.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    display: grid; place-items: center;
    font: 14px/1.5 "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(100%, 396px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 16px;
  }
  .hd h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .hd p  { font-size: 12px; color: var(--muted); margin: 3px 0 14px; }

  .drive { display: flex; align-items: center; gap: 16px; }
  .ring { flex: none; }

  /* The two-half compositor pie: rL (right half, 0–180°) + rR (left half, revealed only
     past 50%). One rAF drives two dashoffsets — fewer than a degree ever re-paints. */
  .track { fill: none; stroke: color-mix(in srgb, var(--muted) 25%, transparent); stroke-width: 3; }
  .arc   { fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round;
           transition: stroke var(--base) ease; }
  .done .arc { stroke: var(--ok); }
  .tick { fill: none; stroke: var(--ok); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
          stroke-dasharray: 27; stroke-dashoffset: 27; opacity: 0;
          transition: stroke-dashoffset 260ms cubic-bezier(.3,.9,.3,1) 70ms, opacity 120ms ease 70ms; }
  .done .tick { stroke-dashoffset: 0; opacity: 1; }
  .pct { font: 600 11px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
         fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .done .pct { fill: var(--ok); }

  .drive .c { flex: 1; min-width: 0; }
  .cta {
    appearance: none; cursor: pointer; display: block; width: 100%;
    border: 1px solid color-mix(in srgb, var(--accent-strong) 55%, transparent);
    background: var(--accent); color: var(--accent-ink);
    font: 600 13px/1 "Inter", sans-serif; padding: 11px 16px; border-radius: 8px;
    transition: background var(--fast) ease, opacity var(--fast) ease, transform var(--fast) ease;
  }
  .cta:hover { background: var(--accent-strong); }
  .cta:active { transform: scale(.99); }
  .cta[disabled] { opacity: .6; cursor: default; transform: none; }
  .cta:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  .stat { font: 500 11px/1.4 "JetBrains Mono", ui-monospace, Menlo, monospace; color: var(--muted); margin: 12px 0 0; }

  .cap { position: fixed; left: 12px; bottom: 12px;
         font: 600 10px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
         color: var(--faint); letter-spacing: .08em; text-transform: uppercase; user-select: none; }
  .chip { position: fixed; right: 14px; bottom: 12px; appearance: none; cursor: pointer;
          border: 1px solid var(--line); background: var(--panel); color: var(--muted);
          border-radius: 999px; padding: 8px 14px;
          font: 600 11px/1 "Inter", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .chip:hover { color: var(--ink); }
  .chip:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    .arc, .tick, .cta { transition: none; }
  }
</style>
</head>
<body>
  <main class="card" id="box" aria-label="Health export preview">
    <div class="hd">
      <h2>Export</h2>
      <p>Health · October cycle + activity, as csv</p>
    </div>
    <div class="drive">
      <svg class="ring" id="ring" width="66" height="66" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="track" cx="22" cy="22" r="18"/>
        <path class="arc" id="rL" d="M22 4 A18 18 0 0 1 22 40"/>
        <path class="arc" id="rR" d="M22 40 A18 18 0 0 1 22 4"/>
        <path class="tick" d="M14 22.5 L20 28.5 L30 15.5"/>
        <text class="pct" id="pct" x="22" y="26">0%</text>
      </svg>
      <div class="c">
        <button class="cta" type="button" id="go">Export health data</button>
        <p class="stat" id="stat" role="status" aria-live="polite">Ready — includes Cycle days and step targets.</p>
      </div>
    </div>
  </main>
  <div class="cap">Nucleus · Upload progress (rebuilt)</div>
  <button class="chip" type="button" id="themeBtn">Light / Dark</button>
<script>
(function () {
  "use strict";
  var DUR = 2800;                       // upstream easing + duration, kept exactly
  var HALF = Math.PI * 18;              // half-circumference of r=18 (one arc unit)
  var box = document.getElementById("box");
  var rL = document.getElementById("rL");
  var rR = document.getElementById("rR");
  var pct = document.getElementById("pct");
  var stat = document.getElementById("stat");
  var btn = document.getElementById("go");
  var themeBtn = document.getElementById("themeBtn");

  var running = false, raf = 0, t0 = 0;

  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; } // easeInOutCubic

  function frame(now) {
    var e = ease(Math.min(1, (now - t0) / DUR));
    var deg = e * 360;
    if (deg <= 180) {                    // left-then-right sequencing per upstream
      rL.style.strokeDashoffset = (HALF * (1 - deg / 180)).toFixed(2);
      rR.style.strokeDashoffset = HALF.toFixed(2);   // hidden until past 50%
    } else {
      rL.style.strokeDashoffset = "0";
      rR.style.strokeDashoffset = (HALF * (1 - (deg - 180) / 180)).toFixed(2);
    }
    var pc = Math.round(e * 100);
    pct.textContent = pc + "%";
    if (pc < 100) { raf = requestAnimationFrame(frame); }
    else done();
  }
  function wake() { if (!raf) raf = requestAnimationFrame(frame); }

  function start() {
    if (running) return;
    running = true;
    box.classList.remove("done");        // reset tick + ok swap
    rL.style.strokeDashoffset = HALF.toFixed(2);
    rR.style.strokeDashoffset = HALF.toFixed(2);
    pct.textContent = "0%";
    btn.disabled = true; btn.textContent = "Exporting…";
    stat.textContent = "Exporting — Cycle days + activity…";
    t0 = performance.now();
    wake();                              // single run, settle-and-stop (no auto cycle)
  }
  function done() {
    running = false;
    box.classList.add("done");           // --ok swap + tick draw-in (CSS)
    btn.disabled = false; btn.textContent = "Export again";
    stat.textContent = "Complete — health-2026-10.csv · 2.1 MB saved";
    raf = 0;
  }

  btn.addEventListener("click", start);

  themeBtn.addEventListener("click", function () {
    var el = document.documentElement;
    var dark = el.getAttribute("data-theme") === "dark";
    el.setAttribute("data-theme", dark ? "light" : "dark");
    themeBtn.textContent = dark ? "Light / Dark" : "Dark / Light";
  });

  // hidden arcs at boot
  rL.style.strokeDasharray = HALF.toFixed(2);
  rR.style.strokeDasharray = HALF.toFixed(2);
  rL.style.strokeDashoffset = HALF.toFixed(2);
  rR.style.strokeDashoffset = HALF.toFixed(2);
})();
</script>
</body>
</html>
