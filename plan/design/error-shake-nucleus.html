<!doctype html>
<!-- Nucleus-native rebuild of the Forever Components "Error Shake" technique.
     Upstream reference: plan/design/forever/error-shake.html (untracked, licence-unstated — study only).
     Extraction notes: plan/design-sources.md → "Pattern rebuilds" → "Error Shake".
     Kept: the decaying-sine envelope (AMP 13px, DECAY 7.5 → the ≈550ms shake feel) baked into
     a CSS keyframe track (zero rAF, GPU translateX); the 180ms border flush (their rAF RGB
     lerp → our 200ms --base transition to --error + error-soft ring); the X mark pop at ~1.18
     overshoot with the two strokes drawn center-out, second stroke staggered 70ms.
     Production fixes vs upstream: error persists until the VALUE CHANGES — their 2.7s
     auto-reset is wrong (a form that forgives itself mid-error teaches nothing); the ghost
     email text, blinking caret and idle auto-error demo are dropped (event-driven for real).
     Context: Money add-expense quick entry. Nucleus tokens, --error semantic pair,
     reduced-motion keeps a static error frame (border + mark + message, no shake). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Nucleus-native error shake: a decay-baked 550ms translateX shake, 200ms border flush to --error, staggered X draw, role=status message — error persists until the value changes.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nucleus — Error Shake (rebuilt)</title>
<style>
  /* Tokens carried verbatim from desktop/src/styles.css (v0.16.1 stage). */
  :root, :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f1ea; --panel: #ffffff; --panel-2: #ede7dc;
    --ink: #221c15; --muted: #6e6455; --faint: #9c9181;
    --line: rgba(32, 26, 19, 0.085);
    --accent: #be7a2e; --accent-strong: #a9661f; --accent-ink: #fff8ec;
    --accent-soft: rgba(190, 122, 46, 0.13);
    --ok: #4c8a57; --ok-soft: rgba(76, 138, 87, 0.14);
    --warn: #bc8524; --warn-soft: rgba(188, 133, 36, 0.16);
    --error: #b4534b; --error-soft: rgba(180, 83, 75, 0.14);
    --shadow: 0 1px 2px rgba(30, 24, 17, 0.05), 0 10px 26px -20px rgba(30, 24, 17, 0.28);
    /* v0.17 motion tokens (plan/desktop-uix-v017.md §5) */
    --fast: 120ms; --base: 200ms; --spring: 320ms cubic-bezier(.32,.72,0,1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161310; --panel: #211d18; --panel-2: #1b1713;
    --ink: #f1ebe0; --muted: #a79b8a; --faint: #786e60;
    --line: rgba(255, 255, 255, 0.075);
    --accent: #d8934c; --accent-strong: #e8a45c; --accent-ink: #241708;
    --accent-soft: rgba(216, 147, 76, 0.16);
    --ok: #7fb98a; --ok-soft: rgba(127, 185, 138, 0.16);
    --warn: #d9a94c; --warn-soft: rgba(217, 169, 76, 0.18);
    --error: #d9837a; --error-soft: rgba(217, 131, 122, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -22px rgba(0, 0, 0, 0.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    display: grid; place-items: center;
    font: 14px/1.5 "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(100%, 396px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 16px;
  }
  .hd h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .hd p  { font-size: 12px; color: var(--muted); margin: 3px 0 14px; }

  .flab { display: block; font: 600 10px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
          letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 7px 2px; }

  .field {
    display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    transition: border-color var(--base) ease, box-shadow var(--base) ease;
  }
  .field:focus-within {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .card:focus-within { outline: none; }
  .cur { color: var(--muted); font-weight: 600; font-size: 14px; }
  .field input {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--ink); font: 500 15px/1 "Inter", sans-serif; font-variant-numeric: tabular-nums;
  }
  .field input::placeholder { color: var(--faint); }

  /* Error state: fill-in flush, error ring replaces the neutral focus ring. */
  .card.err .field {
    border-color: var(--error);
    box-shadow: 0 0 0 3px var(--error-soft);
  }
  /* The shake — decay envelope exp(−7.5t), AMP 13px, ≈0.55s, baked into keyframes.
     Re-armed per invalid submit via forced reflow; plays on the GPU only. */
  .card.err .field { animation: shake .55s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes shake {
    0%   { transform: translateX(0); }
    11%  { transform: translateX(11px); }
    22%  { transform: translateX(-9px); }
    33%  { transform: translateX(6px); }
    45%  { transform: translateX(-4px); }
    57%  { transform: translateX(2.4px); }
    70%  { transform: translateX(-1.4px); }
    82%  { transform: translateX(.8px); }
    92%  { transform: translateX(-.4px); }
    100% { transform: translateX(0); }
  }

  /* X mark: pops at ~1.18 overshoot via the bezier; strokes draw center-out, staggered 70ms. */
  .mark { flex: none; width: 20px; height: 20px; opacity: 0; transform: scale(.4);
          transition: opacity var(--fast) ease, transform 240ms cubic-bezier(.34,1.56,.64,1); }
  .card.err .mark { opacity: 1; transform: scale(1); }
  .mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .mark line { stroke: var(--error); stroke-width: 2.4; stroke-linecap: round;
               transform-box: fill-box; transform-origin: center; transform: scale(0);
               transition: transform 200ms cubic-bezier(.3,.9,.3,1); }
  .card.err .ml1 { transform: scale(1); }
  .card.err .ml2 { transform: scale(1); transition-delay: 70ms; }

  .msg {
    min-height: 15px; margin: 8px 0 0 2px; font-size: 12px; color: var(--error);
    opacity: 0; transform: translateY(3px);
    transition: opacity var(--base) ease, transform var(--base) ease, color var(--fast) ease;
  }
  .card.err .msg, .card.ok .msg { opacity: 1; transform: none; }
  .card.ok { --flavor: var(--ok); }
  .card.ok .field { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .card.ok .msg { color: var(--ok); }

  .btn {
    appearance: none; cursor: pointer; margin-top: 12px; width: 100%;
    border: 1px solid color-mix(in srgb, var(--accent-strong) 55%, transparent);
    background: var(--accent); color: var(--accent-ink);
    font: 600 13px/1 "Inter", sans-serif; padding: 11px 16px; border-radius: 8px;
    transition: background var(--fast) ease, transform var(--fast) ease;
  }
  .btn:hover { background: var(--accent-strong); }
  .btn:active { transform: scale(.99); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  .cap { position: fixed; left: 12px; bottom: 12px;
         font: 600 10px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
         color: var(--faint); letter-spacing: .08em; text-transform: uppercase; user-select: none; }
  .chip { position: fixed; right: 14px; bottom: 12px; appearance: none; cursor: pointer;
          border: 1px solid var(--line); background: var(--panel); color: var(--muted);
          border-radius: 999px; padding: 8px 14px;
          font: 600 11px/1 "Inter", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .chip:hover { color: var(--ink); }
  .chip:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    /* static error frame: border + mark + message appear instantly, no shake */
    .card.err .field { animation: none; }
    .field, .mark, .mark line, .msg, .btn { transition: none; }
  }
</style>
</head>
<body>
  <main class="card" id="card" aria-label="Add expense form preview">
    <div class="hd">
      <h2>Add expense</h2>
      <p>Money · quick entry — try saving an empty or nonsense amount</p>
    </div>
    <form id="f" novalidate>
      <label class="flab" for="amt">Amount</label>
      <div class="field">
        <span class="cur" aria-hidden="true">₹</span>
        <input id="amt" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-describedby="msg">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 22 22">
            <line class="ml1" x1="5" y1="5" x2="17" y2="17"/>
            <line class="ml2" x1="17" y1="5" x2="5" y2="17"/>
          </svg>
        </span>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <button class="btn" type="submit">Save expense</button>
    </form>
  </main>
  <div class="cap">Nucleus · Error shake (rebuilt)</div>
  <button class="chip" type="button" id="themeBtn">Light / Dark</button>
<script>
(function () {
  "use strict";
  var card = document.getElementById("card");
  var amt = document.getElementById("amt");
  var msg = document.getElementById("msg");
  var themeBtn = document.getElementById("themeBtn");

  function fail() {
    // re-arm the shake keyframe even on repeated invalid submits
    card.classList.remove("err");
    void card.offsetWidth;
    card.classList.add("err");
    msg.textContent = "Enter an amount above ₹0";
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var n = parseFloat(amt.value.trim().replace(",", "."));
    if (!isFinite(n) || n <= 0) { fail(); amt.focus(); return; }
    card.classList.remove("err");
    card.classList.add("ok");
    msg.textContent = "Saved ₹" + n.toFixed(2) + " — added to Today";
    amt.value = "";
  });

  // THE production fix vs upstream: the error holds until the value changes.
  // No 2.7s auto-reset — a form must not forgive itself while the user is reading it.
  amt.addEventListener("input", function () {
    card.classList.remove("err");
    card.classList.remove("ok");
  });

  themeBtn.addEventListener("click", function () {
    var el = document.documentElement;
    var dark = el.getAttribute("data-theme") === "dark";
    el.setAttribute("data-theme", dark ? "light" : "dark");
    themeBtn.textContent = dark ? "Light / Dark" : "Dark / Light";
  });
})();
</script>
</body>
</html>
