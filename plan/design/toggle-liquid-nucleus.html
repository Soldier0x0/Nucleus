<!doctype html>
<!-- Nucleus-native rebuild of the Forever Components "Liquid Toggle" technique.
     Upstream reference: plan/design/forever/liquid-toggle.html (untracked, licence-unstated — study only).
     Extraction notes: plan/design-sources.md → "Pattern rebuilds" → "Liquid Toggle".
     Differences vs upstream: the SVG goo filter is deliberately NOT ported (their own metadata
     flags rendering cost in dense forms, and droplets land sub-pixel at the §4 switch scale) —
     the elastic feel is kept via the §4 spring tier plus a leading-edge knob squish.
     role="switch"/aria-checked replaces aria-pressed (correct toggle protocol), production is
     event-driven (no idle auto-toggle), Nucleus tokens + a real settings-row context. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Nucleus-native liquid toggle: 40×24 pill switch with spring-travel knob and leading-edge squish, role=switch, settings-row context.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nucleus — Liquid Toggle (rebuilt)</title>
<style>
  /* Tokens carried verbatim from desktop/src/styles.css (v0.16.1 stage). */
  :root, :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f1ea; --panel: #ffffff; --panel-2: #ede7dc;
    --ink: #221c15; --muted: #6e6455; --faint: #9c9181;
    --line: rgba(32, 26, 19, 0.085);
    --accent: #be7a2e; --accent-strong: #a9661f; --accent-ink: #fff8ec;
    --accent-soft: rgba(190, 122, 46, 0.13);
    --shadow: 0 1px 2px rgba(30, 24, 17, 0.05), 0 10px 26px -20px rgba(30, 24, 17, 0.28);
    /* v0.17 motion tokens (plan/desktop-uix-v017.md §5) */
    --fast: 120ms; --base: 200ms; --spring: 320ms cubic-bezier(.32,.72,0,1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161310; --panel: #211d18; --panel-2: #1b1713;
    --ink: #f1ebe0; --muted: #a79b8a; --faint: #786e60;
    --line: rgba(255, 255, 255, 0.075);
    --accent: #d8934c; --accent-strong: #e8a45c; --accent-ink: #241708;
    --accent-soft: rgba(216, 147, 76, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -22px rgba(0, 0, 0, 0.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    display: grid; place-items: center;
    font: 14px/1.5 "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Settings-row context — where the §4 switch replaces checkbox rows. */
  .card {
    width: min(100%, 396px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .hd { padding: 15px 16px 12px; }
  .hd h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .hd p  { font-size: 12px; color: var(--muted); margin: 3px 0 0; }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-top: 1px solid var(--line);
    transition: background var(--fast) ease;
  }
  .row:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .row .label { flex: 1; min-width: 0; }
  .row .label b   { display: block; font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
  .row .label span{ display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  /* The switch — button is the track; knob rides inside. 40×24 (§4 desktop scale). */
  .switch {
    position: relative; flex: none; width: 40px; height: 24px;
    appearance: none; border: 0; padding: 0; cursor: pointer;
    border-radius: 999px; background: var(--panel-2);
    box-shadow: inset 0 0 0 1px var(--line);
    transition: background-color var(--base) ease, box-shadow var(--base) ease;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(30, 24, 17, 0.18);
    transform: translateX(0);
    transition: transform 200ms cubic-bezier(.32,.72,0,1), background-color var(--base) ease;
  }
  .switch[aria-checked="true"] {
    background: var(--accent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-strong) 60%, transparent);
  }
  .switch[aria-checked="true"] .knob { transform: translateX(16px); border-color: transparent; }
  /* leading-edge squish re-armed per flip (scale is an independent property, so the
     translateX transform and the stretch compose) */
  .switch.flip .knob { animation: squish 220ms cubic-bezier(.32,.72,0,1); }
  @keyframes squish { 0% { scale: 1 1; } 45% { scale: 1.26 .82; } 100% { scale: 1 1; } }
  .switch:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 1px var(--line), 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .cap { position: fixed; left: 12px; bottom: 12px;
         font: 600 10px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
         color: var(--faint); letter-spacing: .08em; text-transform: uppercase; user-select: none; }
  .chip { position: fixed; right: 14px; bottom: 12px; appearance: none; cursor: pointer;
          border: 1px solid var(--line); background: var(--panel); color: var(--muted);
          border-radius: 999px; padding: 8px 14px;
          font: 600 11px/1 "Inter", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .chip:hover { color: var(--ink); }
  .chip:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch .knob, .row { transition: none; }
    .switch.flip .knob { animation: none; }
  }
</style>
</head>
<body>
  <main class="card" aria-label="Settings preview">
    <div class="hd">
      <h2>Settings</h2>
      <p>General · desktop</p>
    </div>
    <div class="row">
      <span class="label" id="sw1-l"><b>Auto-backup on close</b><span>Writes an encrypted snapshot when the window closes</span></span>
      <button class="switch" role="switch" aria-checked="true" aria-labelledby="sw1-l"><span class="knob" aria-hidden="true"></span></button>
    </div>
    <div class="row">
      <span class="label" id="sw2-l"><b>Compact rows</b><span>Tighter list density across every module</span></span>
      <button class="switch" role="switch" aria-checked="false" aria-labelledby="sw2-l"><span class="knob" aria-hidden="true"></span></button>
    </div>
    <div class="row">
      <span class="label" id="sw3-l"><b>Show sync line</b><span>Status strip for pairing and backup progress</span></span>
      <button class="switch" role="switch" aria-checked="true" aria-labelledby="sw3-l"><span class="knob" aria-hidden="true"></span></button>
    </div>
  </main>
  <div class="cap">Nucleus · Liquid toggle (rebuilt)</div>
  <button class="chip" type="button" id="themeBtn">Light / Dark</button>
<script>
(function () {
  "use strict";
  // Production is event-driven: no idle demo, no auto-toggle. The squish class is
  // re-armed per flip via forced reflow so rapid clicks replay the stretch.
  document.querySelectorAll(".switch").forEach(function (sw) {
    sw.addEventListener("click", function () {
      var on = sw.getAttribute("aria-checked") === "true";
      sw.setAttribute("aria-checked", String(!on));
      sw.classList.remove("flip");
      void sw.offsetWidth;
      sw.classList.add("flip");
    });
  });

  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var el = document.documentElement;
    var dark = el.getAttribute("data-theme") === "dark";
    el.setAttribute("data-theme", dark ? "light" : "dark");
    themeBtn.textContent = dark ? "Light / Dark" : "Dark / Light";
  });
})();
</script>
</body>
</html>
