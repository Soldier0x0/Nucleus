# Builds the Nucleus desktop app (Windows + Linux) from desktop/.
#
# Groundwork (see plan/desktop-plan.md, phase D3): this builds installers as
# Actions artifacts on pull requests that touch desktop/ or the shared core.
# It does not publish anything yet. The release job will attach these files to
# the same GitHub Release as the APK once the desktop app is ready to ship.
#
# Windows: .msi and -setup.exe (unsigned, so SmartScreen asks once).
# Linux: .deb and .AppImage.

name: Desktop

concurrency:
  group: nucleus-desktop-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/src/core/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JavaScript dependencies
        working-directory: desktop
        run: yarn install --frozen-lockfile

      - name: Build installers
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
