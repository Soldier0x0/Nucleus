# Builds the installable Nucleus releases: an Android APK and the Windows and
# Linux desktop installers. One merged pull request publishes one version that
# carries every platform's file in the same GitHub Release.
#
# The JavaScript bundle is compiled into the APK, so the file can be copied to
# a phone and installed without Expo Go or a development server.
#
# A successful build on main publishes the files as a GitHub Release, named
# nucleus-v0.1.apk, nucleus-v0.2.apk, and so on. The version stays below 1.
# Download those files from Releases. They are the installers, not the Actions
# artifact zips. Notes come from the CHANGELOG.md section for the version being
# published. That section must be short bullet points of what the version
# added or changed.
# One pull request publishes one version. A section for any other unpublished
# version fails the job. A missing section for a later version does not fail
# the build and does not publish.
#
# The jobs stay on the free GitHub runners. The APK job reuses the Gradle
# cache between runs and skips release lint. A docs, changelog, or README-only
# change does not compile. A green pull-request APK for the same git tree is
# what gets published, so the merge does not compile that tree a second time.
# The APK contains only arm64-v8a, which is what current phones use.
#
# The desktop job builds installers on Windows (.msi, -setup.exe) and Linux
# (.deb, .AppImage) only when the change touches desktop/, the shared core,
# the release scripts, or the changelog. On merge it waits for the APK job to
# create the release, then attaches its installers to the same release.
#
# Signing:
# - With no secrets, the APK is signed with the debug keystore that Expo puts in
#   every generated Android project. The certificate stays the same across
#   builds, so a newer APK can replace an older one.
# - To sign with your own key, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD.
#   Create the base64 value with: base64 -w 0 release.keystore

name: Android APK

# One build per branch. A newer push cancels the run that is already going,
# so a follow-up commit does not compile a second APK beside the first.
concurrency:
  group: nucleus-android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Choose the next version under 1.0
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The version pick must never see an empty tag list: a failed listing
          # makes the newest changelog heading look unpublished twice and the
          # builds stamp the next minor into files nobody asked for.
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v0." --jq '.[].ref | sub("^refs/tags/"; "")')
          if ! echo "$tags" | grep -q "v0."; then
            echo "No published tags could be listed; stopping instead of stamping a wrong version." >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          name=$(node .github/scripts/next-android-version.js --changelog CHANGELOG.md $tags)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          echo "Next release is v${name}"
          # One release, one version. Fail before any compile.
          # shellcheck disable=SC2086
          node .github/scripts/release-notes.js --only-this-version "v${name}" $tags
          node .github/scripts/release-notes.js --if-ready "v${name}" > release-notes.md
          if [ -s release-notes.md ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to compile
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          name=$(node .github/scripts/apk-plan.js name "$tree")
          echo "artifact_name=${name}" >> "$GITHUB_OUTPUT"
          files=/tmp/changed-files.txt
          : > "$files"
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ]; then
            git fetch --no-tags origin "$BASE"
            git diff --name-only "$BASE" HEAD > "$files"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$BEFORE" || true
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE" HEAD > "$files"
            fi
          fi
          artifact_ready=false
          run_id=
          if listing=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[].workflow_run.id'); then
            while read -r rid; do
              [ -n "${rid:-}" ] || continue
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" --jq .conclusion || true)
              if [ "$conclusion" = "success" ]; then
                artifact_ready=true
                run_id="$rid"
                break
              fi
            done < <(printf '%s\n' "$listing")
          else
            echo "Could not look up an existing APK. This run will compile if the change needs one."
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          node .github/scripts/apk-plan.js plan --event "$EVENT" --files "$files" --artifact-ready "$artifact_ready"

      - name: Set up Node
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install the SDK packages this app compiles against
        if: steps.plan.outputs.build == 'true'
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        if: steps.plan.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Pull-request runs may read the shared cache but never poison it.
          cache-read-only: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}

      - name: Install JavaScript dependencies
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Type-check
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run the core unit tests
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend
        run: yarn test

      - name: Run the release script tests
        if: steps.plan.outputs.build == 'true'
        run: node --test ".github/scripts/*.test.js" "frontend/plugins/*.test.js"

      - name: Set the Android version
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: node ../.github/scripts/stamp-android-version.js

      - name: Generate the Android project
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Check the camera permission survived prebuild
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend
        run: |
          line=$(grep 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || true)
          if [ -z "${line}" ] || echo "${line}" | grep -q 'tools:node="remove"'; then
            echo "android.permission.CAMERA is missing from the generated AndroidManifest.xml or is marked tools:node=\"remove\". Pairing by QR code would ship broken."
            exit 1
          fi

      - name: Configure release signing
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            # A publishable run must not quietly sign with the debug keystore:
            # every phone watching the updater would then install one APK line
            # signed by a key anyone holds.
            if [ "${{ steps.version.outputs.publish }}" = "true" ] && [ "$EVENT" != "pull_request" ]; then
              echo "A release is ready to publish, but ANDROID_KEYSTORE_BASE64 is missing. Refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "Signing with the debug keystore bundled by Expo prebuild."
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore
          cat ../.github/android-release-signing.gradle >> android/app/build.gradle

      - name: Turn on the Gradle build cache
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend/android
        run: node ../../.github/scripts/gradle-properties.js gradle.properties

      - name: Build the release APK
        if: steps.plan.outputs.build == 'true'
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel --stacktrace -PreactNativeArchitectures=arm64-v8a -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Collect the APK
        if: steps.plan.outputs.build == 'true'
        run: |
          found=$(find frontend/android/app/build/outputs/apk/release -type f -name '*.apk' | wc -l)
          if [ "$found" -ne 1 ]; then
            echo "Expected one release APK, found ${found}."
            find frontend/android/app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          cp frontend/android/app/build/outputs/apk/release/*.apk nucleus.apk
          ls -lh nucleus.apk
          if ! unzip -p nucleus.apk AndroidManifest.xml | strings -el | grep -q 'android.permission.CAMERA'; then
            echo "The built APK lost android.permission.CAMERA. Pairing by QR code would ship broken."
            exit 1
          fi

      - name: Upload the APK
        if: steps.plan.outputs.build == 'true'
        # Artifact storage is only the reuse shortcut. When it is unavailable,
        # the merge run compiles this tree itself before publishing.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: nucleus.apk
          if-no-files-found: error
          retention-days: 30

      - name: Download the APK from the green build
        if: steps.plan.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.plan.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.plan.outputs.artifact_name }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -n "$ARTIFACT_NAME" -D apk-out
          find apk-out -type f -name '*.apk' -exec cp {} nucleus.apk \;
          test -s nucleus.apk
          ls -lh nucleus.apk

      - name: Publish the APK as a GitHub release
        # The release is created even when this push produced no APK (docs-only
        # change): the desktop job waits for it. Without the file, the phone
        # simply keeps the previous APK until the next code merge.
        if: steps.version.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test -s release-notes.md
          # Target the commit that was checked out. Without this, gh release
          # create tags the default branch instead. This is the only tag created.
          if [ "${{ steps.plan.outputs.have_apk }}" = "true" ]; then
            cp nucleus.apk "nucleus-${TAG}.apk"
            gh release create "$TAG" "nucleus-${TAG}.apk" --title "$TAG" --target "$GITHUB_SHA" --latest --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --latest --notes-file release-notes.md
          fi
          echo "Release ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  desktop:
    name: Build desktop (${{ matrix.os }})
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Decide whether this change touches the desktop app
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          case "$EVENT" in
            pull_request)
              if [ -n "$BASE" ]; then
                git fetch --no-tags origin "$BASE"
                if git diff --name-only "$BASE" HEAD | grep -qE '^(desktop/|frontend/src/core/|\.github/scripts/|\.github/workflows/android-apk\.yml|CHANGELOG\.md)'; then
                  changed=true
                else
                  changed=false
                fi
              fi
              ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                git fetch --no-tags origin "$BEFORE" || true
                if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                  if git diff --name-only "$BEFORE" HEAD | grep -qE '^(desktop/|frontend/src/core/|\.github/scripts/|\.github/workflows/android-apk\.yml|CHANGELOG\.md)'; then
                    changed=true
                  else
                    changed=false
                  fi
                fi
              fi
              ;;
          esac
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Desktop build needed: ${changed}"

      # The version is the one the apk job picked (job outputs). Picking again
      # here raced the tag the apk chase had just created and could stamp a
      # desktop build as the next minor.
      - name: Set up Node
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.changed == 'true'

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.changed == 'true' && github.event_name != 'pull_request'
        with:
          workspaces: desktop/src-tauri -> target

      - name: Linux build libraries
        if: steps.scope.outputs.changed == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JavaScript dependencies
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        working-directory: desktop
        run: yarn install --frozen-lockfile

      - name: Test the Rust side (sync server)
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        working-directory: desktop/src-tauri
        run: cargo test --locked --quiet

      - name: Stamp the desktop version
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: node .github/scripts/stamp-desktop-version.js --version "${{ needs.apk.outputs.name }}"

      - name: Build installers
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.scope.outputs.changed == 'true'
        # Artifact storage is only a shortcut for future reuse. When it is
        # unavailable, the merge run still builds and attaches the installers.
        continue-on-error: true
        with:
          name: nucleus-desktop-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Attach the Linux installers to the release
        if: steps.scope.outputs.changed == 'true' && needs.apk.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.apk.outputs.tag }}
        run: |
          set -euo pipefail
          # The apk job created the release before this job could start.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null
          mkdir -p release-files
          cp desktop/src-tauri/target/release/bundle/deb/*.deb "release-files/nucleus-${TAG}-linux-amd64.deb"
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage "release-files/nucleus-${TAG}-linux-amd64.AppImage"
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig "release-files/nucleus-${TAG}-linux-amd64.AppImage.sig"
          gh release upload "$TAG" release-files/* --clobber
          echo "Attached Linux installers to ${TAG}"

      - name: Compose the updater manifest
        if: steps.scope.outputs.changed == 'true' && needs.apk.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.apk.outputs.tag }}
        run: |
          set -euo pipefail
          # Windows and Linux upload independently; wait until both sides are on the release.
          ok=false
          for _ in $(seq 1 60); do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if echo "$names" | grep -q "linux-amd64.AppImage.sig" && echo "$names" | grep -q "windows-x64-setup.exe.sig"; then ok=true; break; fi
            echo "Waiting for both update signatures..."
            sleep 30
          done
          if [ "$ok" != "true" ]; then
            echo "The signature pair never landed on ${TAG}; no updater manifest was composed." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null
          mkdir -p release-files
          gh release download "$TAG" --pattern "*.sig" --dir release-files --clobber
          node .github/scripts/latest-json.js --tag "$TAG" --assets-dir release-files --version "${{ needs.apk.outputs.name }}"
          gh release upload "$TAG" release-files/latest.json --clobber
          echo "Attached the updater manifest to ${TAG}"

      - name: Attach the Windows installers to the release
        if: steps.scope.outputs.changed == 'true' && needs.apk.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.apk.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null
          mkdir -p release-files
          cp desktop/src-tauri/target/release/bundle/msi/*.msi "release-files/nucleus-${TAG}-windows-x64.msi"
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "release-files/nucleus-${TAG}-windows-x64-setup.exe"
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig "release-files/nucleus-${TAG}-windows-x64-setup.exe.sig"
          gh release upload "$TAG" release-files/* --clobber
          echo "Attached Windows installers to ${TAG}"
