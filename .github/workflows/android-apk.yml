# Builds a single installable Nucleus release APK.
#
# The JavaScript bundle is compiled into the APK, so the file can be copied to
# a phone and installed without Expo Go or a development server.
#
# A successful build on main publishes the APK itself as a GitHub Release, named
# nucleus-v0.1.apk, nucleus-v0.2.apk, and so on. The version stays below 1.
# Download that file from Releases. It is the APK, not the Actions artifact zip.
# Notes come from the CHANGELOG.md section for the version being published.
# A missing section for a later version does not fail the build and does not
# publish. Notes that say the app is unchanged do not publish. Pull requests
# build the APK and do not create a release.
# The APK contains only arm64-v8a, which is what current phones use.
#
# Signing:
# - With no secrets, the APK is signed with the debug keystore that Expo puts in
#   every generated Android project. The certificate stays the same across
#   builds, so a newer APK can replace an older one.
# - To sign with your own key, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD.
#   Create the base64 value with: base64 -w 0 release.keystore

name: Android APK

# One build per branch. A newer push cancels the run that is already going,
# so a follow-up commit does not compile a second APK beside the first.
concurrency:
  group: nucleus-android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the SDK packages this app compiles against
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Choose the next version under 1.0
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v0." --jq '.[].ref | sub("^refs/tags/"; "")' 2>/dev/null || true)
          # shellcheck disable=SC2086
          name=$(node .github/scripts/next-android-version.js $tags)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          echo "Next release is v${name}"

      - name: Set the Android version
        working-directory: frontend
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: node ../.github/scripts/stamp-android-version.js

      - name: Generate the Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Signing with the debug keystore bundled by Expo prebuild."
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore
          cat ../.github/android-release-signing.gradle >> android/app/build.gradle

      - name: Build the release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Collect the APK
        run: |
          found=$(find frontend/android/app/build/outputs/apk/release -type f -name '*.apk' | wc -l)
          if [ "$found" -ne 1 ]; then
            echo "Expected one release APK, found ${found}."
            find frontend/android/app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          cp frontend/android/app/build/outputs/apk/release/*.apk nucleus.apk
          ls -lh nucleus.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-apk
          path: nucleus.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write the release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          node .github/scripts/release-notes.js --if-ready "$TAG" > release-notes.md
          if [ -s release-notes.md ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the APK as a GitHub release
        if: steps.notes.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cp nucleus.apk "nucleus-${TAG}.apk"
          test -s release-notes.md
          # Target the commit that was checked out and built. Without this,
          # gh release create tags the default branch instead.
          gh release create "$TAG" "nucleus-${TAG}.apk" --title "$TAG" --target "$GITHUB_SHA" --latest --notes-file release-notes.md
          echo "Release ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
