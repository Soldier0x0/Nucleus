[package]
name = "nucleus-desktop"
version = "0.0.0"
edition = "2021"

[lib]
name = "nucleus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-stronghold = "2"
blake2 = "0.10"
mdns-sd = "0.21.5"
local-ip-address = "0.6.13"
base64 = "0.23.1"
gethostname = "1.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
